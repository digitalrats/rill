[package]
name = "rill-lang"
version = "0.6.0-M2"
edition = "2021"
description = "rill-lang — a Faust-style functional streaming DSL compiled to rill Algorithm<T>"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/rill-lang"

[dependencies]
rill-core = { workspace = true }
rill-core-actor = { workspace = true }
indexmap = "2"
thiserror = "1.0"
serde = { workspace = true, optional = true, features = ["derive"] }

[features]
default = ["router"]
router = []
serde = ["dep:serde"]
debug = []
growable-arena = []

[dev-dependencies]
float-cmp = "0.9"
serde_json = "1.0"
criterion = { workspace = true, features = ["html_reports"] }
rill-digital-effects = { workspace = true }
rill-core-dsp = { workspace = true }
rill-router = { workspace = true, features = ["lang"] }
rill-sampler = { workspace = true }

[[bench]]
name = "lang_bench"
harness = false
path = "benches/lang_bench.rs"
